<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Pagos</title>
<meta name="description" content="Registra y controla tus pagos mensuales en cuotas.">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101318" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: una sola columna estrecha, resumen arriba, lista abajo y navegación fija al pie. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --fg: #151a22;
  --muted: #5d6878;
  --line: #dfe4eb;
  --accent: #27368a;
  --accent-fg: #ffffff;
  --ok: #17804a;   --ok-bg: #e3f3ea;
  --warn: #9a5b00; --warn-bg: #fdf0d8;
  --bad: #bf2b2b;  --bad-bg: #fbe5e5;
  --off: #667085;  --off-bg: #eceff3;
  --track: #e6eaf0;
  --shadow: 0 1px 2px rgba(20, 30, 50, .06);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101318; --surface: #191d24; --fg: #eef1f5; --muted: #9aa4b2; --line: #2a303a;
    --accent: #8f9cf0; --accent-fg: #0f1320;
    --ok: #5cc98d; --ok-bg: #173325; --warn: #f0b458; --warn-bg: #3a2a10;
    --bad: #f07b7b; --bad-bg: #3d1b1b; --off: #a0a8b5; --off-bg: #262b33;
    --track: #2a303a; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101318; --surface: #191d24; --fg: #eef1f5; --muted: #9aa4b2; --line: #2a303a;
  --accent: #8f9cf0; --accent-fg: #0f1320;
  --ok: #5cc98d; --ok-bg: #173325; --warn: #f0b458; --warn-bg: #3a2a10;
  --bad: #f07b7b; --bad-bg: #3d1b1b; --off: #a0a8b5; --off-bg: #262b33;
  --track: #2a303a; --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font);
  font-size: 17px; line-height: 1.45; -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num, .big, .mid, .amt { font-variant-numeric: tabular-nums; }

main {
  max-width: 560px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px calc(env(safe-area-inset-bottom, 0px) + 104px);
  display: flex; flex-direction: column; gap: 16px;
}
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 1.75rem; letter-spacing: -.01em; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
.label { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .9rem; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }

/* Encabezado de mes */
.month { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month h1 { text-transform: capitalize; font-size: 1.4rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); font-size: 1.4rem; line-height: 1; display: grid; place-items: center;
}

/* Resumen */
.summary { display: flex; flex-direction: column; gap: 12px; }
.big { font-size: 2.4rem; font-weight: 750; letter-spacing: -.02em; line-height: 1.1; }
.mid { font-size: 1.25rem; font-weight: 650; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.split > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bar { height: 10px; border-radius: 99px; background: var(--track); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 99px; background: var(--ok); }
.bar.thin { height: 8px; }

/* Avisos */
.alert {
  display: flex; gap: 10px; align-items: center; width: 100%; text-align: left;
  padding: 14px 16px; border-radius: 14px; border: 0; font-weight: 600;
}
.alert.bad { background: var(--bad-bg); color: var(--bad); }
.alert.warn { background: var(--warn-bg); color: var(--warn); }
.alert.info { background: var(--off-bg); color: var(--fg); font-weight: 500; }
.alert .grow { flex: 1; min-width: 0; }

/* Listas */
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.item {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
}
.item .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.item .name { font-weight: 650; overflow-wrap: anywhere; }
.item .sub { font-size: .9rem; color: var(--muted); }
.item .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.amt { font-weight: 700; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

.chip {
  display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: .8rem; font-weight: 650; white-space: nowrap;
}
.st-pagado { color: var(--ok); background: var(--ok-bg); }
.st-pendiente { color: var(--warn); background: var(--warn-bg); }
.st-vencido { color: var(--bad); background: var(--bad-bg); }
.st-pausada, .st-archivada { color: var(--off); background: var(--off-bg); }
.dot.st-pagado { background: var(--ok); }
.dot.st-pendiente { background: var(--warn); }
.dot.st-vencido { background: var(--bad); }

/* Tarjetas de obligación */
.ob { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 10px; }
.ob-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.ob-top .name { font-size: 1.15rem; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.ob-meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: .95rem; }
.bar.st-pendiente > span { background: var(--accent); }
.bar.st-vencido > span { background: var(--bad); }
.bar.st-pausada > span, .bar.st-archivada > span { background: var(--off); }

/* Botones */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 20px; border-radius: 14px; font-weight: 650; font-size: 1.05rem;
  border: 1px solid var(--line); background: var(--surface);
}
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.block { width: 100%; }
.btn.small { min-height: 40px; font-size: .95rem; padding: 0 14px; border-radius: 12px; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-row.three { grid-template-columns: repeat(3, 1fr); }
.btn-row .btn { padding: 0 8px; }

/* Segmentado */
.seg { display: flex; background: var(--off-bg); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button, .seg label {
  flex: 1; border: 0; background: transparent; padding: 10px 6px; border-radius: 9px; font-weight: 600;
  font-size: .95rem; text-align: center; color: var(--muted);
}
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg .on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.seg label:has(input:checked) { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.seg label:has(input:focus-visible) { outline: 3px solid var(--accent); }

/* Detalle */
.back { align-self: flex-start; border: 0; background: none; color: var(--accent); font-weight: 650; padding: 8px 0; font-size: 1rem; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
.facts > div { display: flex; flex-direction: column; min-width: 0; }
.facts .v { font-weight: 650; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
details > summary { cursor: pointer; font-weight: 700; font-size: 1.1rem; padding: 6px 0; list-style-position: inside; }
details[open] > summary { margin-bottom: 10px; }
.rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.rows li + li { border-top: 1px solid var(--line); }
.row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: none; border: 0; text-align: left; }
.row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row .sub { font-size: .88rem; color: var(--muted); overflow-wrap: anywhere; }
.row:disabled { cursor: default; color: inherit; }

/* Navegación inferior */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 8px calc(env(safe-area-inset-bottom, 0px) + 6px);
  display: flex; justify-content: center;
}
.tabs .inner { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; max-width: 560px; gap: 4px; }
.tabs button {
  border: 0; background: none; padding: 8px 4px; border-radius: 12px; font-size: .85rem; font-weight: 600;
  color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--accent); background: var(--off-bg); }

/* Hojas (formularios) */
dialog.sheet {
  border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92vh;
  border-radius: 22px 22px 0 0; background: var(--surface); color: var(--fg);
}
dialog.sheet::backdrop { background: rgba(10, 14, 22, .45); }
.sheet-body {
  padding: 20px 16px calc(env(safe-area-inset-bottom, 0px) + 20px);
  display: flex; flex-direction: column; gap: 16px; overflow-y: auto; max-height: 92vh;
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.close { border: 0; background: var(--off-bg); width: 40px; height: 40px; border-radius: 50%; font-size: 1.3rem; line-height: 1; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-weight: 600; font-size: .95rem; }
.field small { color: var(--muted); font-size: .85rem; }
.input {
  width: 100%; min-height: 52px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--bg); font-size: 1.1rem;
}
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 > * { min-width: 0; }
.error { color: var(--bad); font-weight: 600; font-size: .95rem; }
@media (min-width: 600px) {
  dialog.sheet { margin: auto; border-radius: 22px; }
}

/* Vacío, bloqueo y aviso breve */
.empty { text-align: center; padding: 32px 12px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty .ring { width: 72px; height: 72px; }
#lock {
  position: fixed; inset: 0; z-index: 50; background: var(--bg);
  display: flex; align-items: center; justify-content: center; padding: 24px 16px;
}
#lock form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 16px; text-align: center; }
#lock .input { text-align: center; font-size: 1.6rem; letter-spacing: .4em; }
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
  background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 600;
  width: max-content; max-width: calc(100% - 32px); text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s;
}
#toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<main id="view" aria-live="polite"></main>

<nav class="tabs" aria-label="Secciones">
  <div class="inner">
    <button type="button" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
      Inicio
    </button>
    <button type="button" data-tab="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>
      Obligaciones
    </button>
    <button type="button" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
      Ajustes
    </button>
  </div>
</nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"><div class="sheet-body" id="sheet-body"></div></dialog>

<div id="lock" hidden>
  <form id="lock-form" autocomplete="off">
    <h1>Mis Pagos</h1>
    <p class="muted">Ingresa tu PIN para continuar</p>
    <input class="input" id="lock-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" aria-label="PIN">
    <p class="error" id="lock-error" hidden></p>
    <button class="btn primary block" type="submit">Desbloquear</button>
  </form>
</div>

<div id="toast" role="status"></div>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
